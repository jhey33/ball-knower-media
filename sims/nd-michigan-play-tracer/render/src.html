<script>
(()=>{'use strict';
const V3=THREE.Vector3,Q=THREE.Quaternion;
const YD=1.0936133,MY=0.9144,G=9.81*YD;
const LOS=-8,HASH=-6.667;
const T_SNAP=1.5,T_QBC=1.78,T_THR=4.05,T_REL=4.45,T_CATCH=6.55,T_DUR=10;
const DT=1/240,TMAX=10.6,NS=Math.ceil(TMAX/DT)+2,P2=Math.PI/2;
const clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const bump=(a,b,c,x)=>sstep(a,b,x)*(1-sstep(b,c,x));
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const nz=(x,s)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i+s*31.7),hash(i+1+s*31.7),u)*2-1};
const angD=(a,b)=>{let d=(b-a)%(2*Math.PI);if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;return d};
const l3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

/* ================= TRACK TOOLKIT (yards, x downfield, z toward near sideline) ================= */
function mono(ts,ys,m0){const n=ts.length,d=[],m=new Float64Array(n);
 for(let i=0;i<n-1;i++)d.push((ys[i+1]-ys[i])/(ts[i+1]-ts[i]));
 for(let i=1;i<n-1;i++){if(d[i-1]*d[i]<=0)m[i]=0;else{const h0=ts[i]-ts[i-1],h1=ts[i+1]-ts[i],w1=2*h1+h0,w2=h1+2*h0;m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i])}}
 m[0]=m0||0;
 return t=>{if(t<=ts[0])return ys[0];if(t>=ts[n-1])return ys[n-1];let lo=0,hi=n-1;while(hi-lo>1){const mi=(lo+hi)>>1;if(ts[mi]<=t)lo=mi;else hi=mi}
  const h=ts[hi]-ts[lo],s=(t-ts[lo])/h,s2=s*s,s3=s2*s;return(2*s3-3*s2+1)*ys[lo]+(s3-2*s2+s)*h*m[lo]+(-2*s3+3*s2)*ys[hi]+(s3-s2)*h*m[hi]}}
function K(keys,v0){const ts=keys.map(k=>k[0]),fx=mono(ts,keys.map(k=>k[1]),v0?v0[0]:0),fz=mono(ts,keys.map(k=>k[2]),v0?v0[1]:0);return t=>[fx(t),fz(t)]}
const vel=(f,t)=>{const a=f(t-0.01),b=f(t);return[(b[0]-a[0])/0.01,(b[1]-a[1])/0.01]};
function roundPoly(poly,r){const out=[];const seg=(a,b)=>{const L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(L/0.2));for(let i=out.length?1:0;i<=n;i++)out.push([lerp(a[0],b[0],i/n),lerp(a[1],b[1],i/n)])};
 let cur=poly[0];for(let i=1;i<poly.length;i++){const B=poly[i];if(i<poly.length-1){const C=poly[i+1];const l1=Math.hypot(B[0]-cur[0],B[1]-cur[1]),l2=Math.hypot(C[0]-B[0],C[1]-B[1]);const rr=Math.min(r,l1*.45,l2*.45);
  const a=[B[0]-(B[0]-cur[0])/l1*rr,B[1]-(B[1]-cur[1])/l1*rr],b=[B[0]+(C[0]-B[0])/l2*rr,B[1]+(C[1]-B[1])/l2*rr];seg(cur,a);
  for(let k=1;k<=12;k++){const u=k/12;out.push([(1-u)*(1-u)*a[0]+2*(1-u)*u*B[0]+u*u*b[0],(1-u)*(1-u)*a[1]+2*(1-u)*u*B[1]+u*u*b[1]])}cur=b}else seg(cur,B)}return out}
function route(poly,prof,o={}){const pts=roundPoly(poly,o.r||2),cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
 const L=cum[cum.length-1];const sRaw=t=>{let s=0;for(let i=0;i<prof.length-1;i++){const[a,va]=prof[i],[b,vb]=prof[i+1];if(t<=a)break;const tb=Math.min(t,b),vt=lerp(va,vb,(tb-a)/(b-a));s+=(va+vt)/2*(tb-a)}return s};
 const sc=o.fitAt!=null?L/sRaw(o.fitAt):1;const f=t=>{const s=Math.min(sRaw(t)*sc,L);let lo=0,hi=cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(cum[m]<=s)lo=m;else hi=m}
  const fr=(s-cum[lo])/((cum[hi]-cum[lo])||1);return[lerp(pts[lo][0],pts[hi][0],fr),lerp(pts[lo][1],pts[hi][1],fr)]};f.scale=sc;f.len=L;return f}
function chase(start,t0,o){const n=Math.ceil((TMAX-t0)/DT)+2,X=new Float64Array(n),Z=new Float64Array(n);const p=start(t0),q=start(t0-0.01);
 let x=p[0],z=p[1],vx=(p[0]-q[0])/0.01,vz=(p[1]-q[1])/0.01;const am=o.amax||7,dec=o.dec||4.5,stop=o.stop||0;let arrive=-1;
 for(let i=0;i<n;i++){const t=t0+i*DT;X[i]=x;Z[i]=z;const g=o.target(t),dx=g[0]-x,dz=g[1]-z,d=Math.hypot(dx,dz);if(arrive<0&&d<stop+0.2)arrive=t;
  let vm=typeof o.vmax=='function'?o.vmax(t):o.vmax;if(o.whistle!==false)vm*=1-0.8*sstep(8.7,9.6,t);
  const w=Math.min(vm,Math.sqrt(2*dec*Math.max(d-stop,0))),wx=d>1e-6?dx/d*w:0,wz=d>1e-6?dz/d*w:0;let ax=(wx-vx)/DT,az=(wz-vz)/DT;const m=Math.hypot(ax,az);if(m>am){ax*=am/m;az*=am/m}
  vx+=ax*DT;vz+=az*DT;x+=vx*DT;z+=vz*DT}
 const f=t=>{if(t<=t0)return start(t);const u=(t-t0)/DT,i=Math.min(Math.floor(u),n-2),fr=u-i;return[lerp(X[i],X[i+1],fr),lerp(Z[i],Z[i+1],fr)]};f.arrive=arrive;return f}
const blendF=(f,g,a,b)=>t=>{if(t<=a)return f(t);if(t>=b)return g(t);const w=sstep(a,b,t),p=f(t),q=g(t);return[lerp(p[0],q[0],w),lerp(p[1],q[1],w)]};
const after=(f,t0,g)=>t=>t<t0?f(t):g(t);
const hold=(x,z)=>()=>[x,z];

/* ================= PLAY SCRIPT ================= */
const ZPROF=[[1.5,0],[1.8,3.0],[2.3,6.4],[2.9,8.0],[3.25,8.2],[3.45,6.0],[3.6,4.6],[3.8,4.4],[4.1,6.2],[4.6,8.0],[5.3,8.6],[5.9,8.2],[6.3,7.0],[6.55,6.6]];
const VPROF=[[1.5,0],[1.8,3.2],[2.3,6.5],[2.9,8.3],[3.6,8.9],[5.0,9.0],[6.0,8.6],[6.55,7.4],[7.2,3.2],[7.8,0]];
const SPROF=[[1.5,0],[1.8,3.0],[2.3,6.2],[2.9,7.9],[3.6,8.4],[5.0,8.5],[6.0,8.1],[6.55,7.0],[7.2,3.0],[7.8,0]];
function buildScript(corr){
 const T={};
 // --- receivers
 const ZR=route([[-8.4,16.5],[3.0,16.4],[4.6,17.5],[17.0,2.4]],ZPROF,{r:0.8,fitAt:T_CATCH});
 const zv=vel(ZR,T_CATCH),ze=ZR(T_CATCH);
 const ZY=K([[T_CATCH,ze[0],ze[1]],[6.8,17.85,1.7],[7.0,18.3,1.45],[7.4,19.2,1.2],[7.8,20.45,1.05],[8.15,21.75,0.95],[8.4,22.55,0.9],[8.7,22.95,0.82],[9.1,23.05,0.8]],zv);
 T.Z=t=>{if(t<T_CATCH)return ZR(t);const p=ZY(t);return[p[0]+corr*sstep(6.6,8.4,t),p[1]]};
 T.Zroute=ZR;
 const X=route([[-8.4,-23.5],[0,-22.9],[45,-22.2]],VPROF,{r:3});T.X=after(X,7.8,chase(X,7.8,{target:()=>[31,-19],vmax:1.8}));
 const S2=route([[-9.3,6.5],[0,7.3],[10,8.6],[45,10]],SPROF,{r:3});T.S2=after(S2,7.8,chase(S2,7.8,{target:()=>[26,6],vmax:2.4}));
 const S3=route([[-9.3,-1.0],[0,-3.4],[10,-4.4],[45,-5.6]],SPROF,{r:3});T.S3=after(S3,7.8,chase(S3,7.8,{target:()=>[27,-2],vmax:2.4}));
 // --- QB / RB
 const QBk=K([[0,-13,-6.67],[1.5,-13,-6.67],[1.78,-13.0,-6.67],[1.95,-13.45,-6.66],[2.2,-14.25,-6.62],[2.45,-14.85,-6.56],[2.62,-15.05,-6.52],[3.2,-14.95,-6.45],[3.7,-14.85,-6.35],[4.05,-14.95,-6.25],[4.45,-14.62,-6.05],[4.8,-14.35,-5.95],[5.6,-14.25,-5.9]]);
 T.QB=after(QBk,5.6,chase(QBk,5.6,{target:()=>[-11.8,-5],vmax:1.5,whistle:false}));
 const RBk=K([[0,-13,-8.2],[1.5,-13,-8.2],[2.0,-12.6,-7.95],[2.6,-12.05,-7.75],[4.45,-11.85,-7.7]]);T.RB=after(RBk,4.6,chase(RBk,4.6,{target:()=>[-6,-5],vmax:2.8}));
 // --- OL / DL
 const ol=(k,tg)=>{const f=K(k);const te=k[k.length-1][0];return after(f,te,chase(f,te,{target:()=>tg,vmax:2.2}))};
 T.LT=ol([[0,-9.0,-8.97],[1.5,-9.0,-8.97],[1.9,-9.7,-9.2],[2.5,-10.5,-9.5],[3.4,-11.0,-9.6],[4.45,-11.4,-9.6],[5.1,-11.45,-9.55]],[-7.5,-8.8]);
 T.LG=ol([[0,-8.75,-7.82],[1.5,-8.75,-7.82],[1.9,-9.2,-7.9],[2.6,-9.7,-8.0],[4.45,-10.2,-8.0],[5.1,-10.2,-7.95]],[-6.8,-7.4]);
 T.C=ol([[0,-8.45,-6.67],[1.5,-8.45,-6.67],[1.9,-9.0,-6.8],[2.6,-9.6,-6.9],[4.45,-10.0,-6.9],[5.1,-10.0,-6.85]],[-6.5,-6.2]);
 T.RG=ol([[0,-8.75,-5.52],[1.5,-8.75,-5.52],[1.9,-9.2,-5.45],[2.6,-9.7,-5.4],[4.45,-10.1,-5.3],[5.1,-10.1,-5.3]],[-6.4,-4.8]);
 T.RT=ol([[0,-9.0,-4.37],[1.5,-9.0,-4.37],[1.9,-9.8,-4.1],[2.5,-10.6,-3.8],[3.4,-11.3,-3.7],[4.45,-11.6,-3.7],[5.1,-11.6,-3.7]],[-7.5,-3.0]);
 const dl=(k,tg)=>{const f=K(k);const te=k[k.length-1][0];return after(f,te,chase(f,te,{target:()=>tg,vmax:3.0}))};
 T.LE=dl([[0,-7.15,-10.2],[1.5,-7.15,-10.2],[1.85,-8.1,-10.4],[2.5,-9.5,-10.5],[3.4,-10.2,-10.5],[4.45,-10.6,-10.35],[4.9,-10.5,-10.3]],[-4,-8.5]);
 T.NT=dl([[0,-7.2,-7.25],[1.5,-7.2,-7.25],[1.8,-7.9,-7.3],[2.6,-8.6,-7.4],[4.45,-9.0,-7.5],[4.9,-8.95,-7.5]],[-4.5,-6.5]);
 T.DT=dl([[0,-7.2,-5.0],[1.5,-7.2,-5.0],[1.8,-8.0,-5.05],[2.6,-8.7,-5.1],[4.45,-9.1,-5.2],[4.9,-9.05,-5.2]],[-4.5,-4]);
 T.RE=dl([[0,-7.15,-2.9],[1.5,-7.15,-2.9],[1.85,-8.3,-2.6],[2.5,-9.8,-2.7],[3.4,-10.6,-2.8],[4.45,-11.1,-2.95],[4.9,-11.0,-3.0]],[-6,-1.5]);
 // --- coverage

 const NIk=K([[0,-4.0,2.8],[0.9,-4.0,2.8],[1.3,-4.4,2.6],[1.5,-4.4,2.6],[2.1,-3.2,2.2],[3.0,0.0,1.0],[3.9,3.4,-0.4],[4.5,4.6,-0.6]]);
 T.NI=after(NIk,4.5,chase(NIk,4.5,{target:t=>{const p=T.Z(t);return[p[0]-1,p[1]]},vmax:5.6,stop:2.4,amax:6}));
 const MIk=K([[0,-3.2,-4.0],[0.5,-3.2,-4.0],[1.1,-3.5,-3.4],[1.5,-3.5,-3.4],[2.0,-2.3,-3.3],[2.8,0.4,-2.8],[3.6,2.5,-2.2],[4.5,3.4,-1.9]]);
 T.MI=after(MIk,4.5,chase(MIk,4.5,{target:t=>{const p=T.Z(t);return[p[0]-2,p[1]-1]},vmax:5.2,stop:3.6}));
 const WIk=K([[0,-3.2,-9.5],[1.5,-3.2,-9.5],[2.0,-2.2,-9.6],[3.0,0.6,-9.4],[3.8,2.2,-9.0],[4.5,2.8,-8.6]]);
 T.WI=after(WIk,4.5,chase(WIk,4.5,{target:t=>{const p=T.Z(t);return[p[0]-3,p[1]-2]},vmax:5.0,stop:4.5}));
 // CB on Z
 const CBk=K([[0,-1.5,17.3],[1.5,-1.5,17.3],[1.9,-0.9,17.3],[2.5,0.7,17.3],[3.0,2.4,17.35],[3.45,5.0,17.6],[3.75,6.4,18.2],[4.0,7.1,18.2]]);
 const CBtr=t=>{const p=T.Z(t),q=T.Z(t+0.06);let dx=q[0]-p[0],dz=q[1]-p[1];const d=Math.hypot(dx,dz)||1;dx/=d;dz/=d;let px=-dz,pz=dx;if(pz<0){px=-px;pz=-pz}
  const tr=lerp(lerp(0,1.25,sstep(4.0,6.5,t)),0.78,sstep(6.5,6.68,t)),lat=lerp(lerp(2.4,0.8,sstep(4.0,6.5,t)),0.62,sstep(6.5,6.68,t));return[p[0]-dx*tr+px*lat,p[1]-dz*tr+pz*lat]};
 const CB1a=blendF(CBk,CBtr,3.85,4.25);
 T.CB1=after(CB1a,7.0,chase(CB1a,7.0,{target:t=>{const p=CB1a(7.0);return[p[0]+3,p[1]+1.4]},vmax:0.01,amax:6,whistle:false}));
 // CB on X
 const C2k=K([[0,-1.0,-23.2],[1.5,-1.0,-23.2],[1.9,-0.4,-23.2],[2.5,1.2,-23.15],[2.9,2.2,-23.1]]);
 const C2r=t=>{const p=X(t);return[p[0]+lerp(3.2,0.9,sstep(2.9,5.0,t)),p[1]-0.85]};
 const C2a=blendF(C2k,C2r,2.9,3.6);T.CB2=after(C2a,6.6,chase(C2a,6.6,{target:()=>[31.5,-21],vmax:3}));
 // SS over #3

const rt=new THREE.WebGLRenderTarget(1920,1080,{type:THREE.HalfFloatType,samples:4,depthTexture:new THREE.DepthTexture(1920,1080)});
const postMat=new THREE.ShaderMaterial({uniforms:{tC:{value:rt.texture},tD:{value:rt.depthTexture},cn:{value:1},cf:{value:1400},focus:{value:60},coc:{value:3},res:{value:new THREE.Vector2(1920,1080)},frame:{value:0},expo:{value:1}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
 fragmentShader:`varying vec2 vUv;uniform sampler2D tC,tD;uniform float cn,cf,focus,coc,frame,expo;uniform vec2 res;
 float lz(float d){float z=d*2.-1.;return 2.*cn*cf/(cf+cn-z*(cf-cn));}
 float cc(vec2 uv){float d=lz(texture2D(tD,uv).r);return clamp(coc*abs(d-focus)/max(d,1.),0.,9.);}
 vec3 RRT(vec3 v){vec3 a=v*(v+.0245786)-.000090537;vec3 b=v*(.983729*v+.4329510)+.238081;return a/b;}
 vec3 aces(vec3 c){const mat3 I=mat3(.59719,.07600,.02840,.35458,.90834,.13383,.04823,.01566,.83777);const mat3 O=mat3(1.60475,-.10208,-.00327,-.53108,1.10813,-.07276,-.07367,-.00605,1.07602);
  c=I*(c*expo/.6);c=RRT(c);return clamp(O*c,0.,1.);}
 vec3 srgb(vec3 c){return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c));}
 void main(){float c0=cc(vUv);vec3 acc=texture2D(tC,vUv).rgb;float wt=1.;
  if(c0>.4){for(int i=0;i<24;i++){float a=float(i)*2.39996;float r=sqrt((float(i)+.5)/24.);vec2 o=vec2(cos(a),sin(a))*r*c0/res;float cs=cc(vUv+o);float w=clamp(cs/(r*c0+.3),0.,1.);acc+=texture2D(tC,vUv+o).rgb*w;wt+=w;}}
  vec3 col=aces(acc/wt);vec2 q=vUv-.5;col*=1.-.22*dot(q,q)*1.6;col=srgb(col);
  float g=fract(sin(dot(vUv*res+frame*1.7,vec2(12.9898,78.233)))*43758.5453);col+=(g-.5)*.018;gl_FragColor=vec4(col,1.);}`,depthTest:false,depthWrite:false});
const postScene=new THREE.Scene();postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

/* ================= CAMERAS ================= */
function smoothArr(fn,tc){const n=NS,A=[];let s=fn(0).clone();for(let i=0;i<n;i++){const t=i*DT,v=fn(t);const k=1-Math.exp(-DT/tc);s.lerp(v,k);A.push(s.clone())}return t=>{const u=clamp(t/DT,0,n-1.001),i=Math.floor(u);return A[i].clone().lerp(A[i+1],u-i)}}
const zp=t=>new V3(PL.Z.smp(PL.Z.X,t),1.0,PL.Z.smp(PL.Z.Z,t));
const camT2=smoothArr(t=>new V3(lerp(-8.5,-2.5,sstep(1.6,4.4,t)),0,lerp(-3.5,-1.5,sstep(1.6,4.4,t))),.35);
const camT3=smoothArr(t=>{const b=t<T_REL?ballEst(t):t<T_CATCH?flightAt(t):zp(t);const z=zp(t);const m=b.clone().lerp(z,.45);m.y=b.y*.45;return m},.22);
const camT4=smoothArr(t=>zp(t).add(new V3(.8,-.15,0)),.16);
function shot(t){const o={};
 if(t<T_REL){const w=sstep(1.55,2.5,t);o.pos=new V3(-4,30.5,77);o.tg=new V3(lerp(-6.5,0,0),0,-2.5).lerp(camT2(t),w);o.fov=lerp(25,16.5,w)+1.2*sstep(3.2,4.4,t);o.coc=5.5;o.sh=45;o.id=1+(t>1.5)}
 else if(t<6.4){const w=sstep(T_REL,T_REL+.5,t);const a=camT2(t),b=camT3(t);o.pos=new V3(-4,30.5,77);o.tg=a.lerp(b,w);o.fov=lerp(17.7,18.8,w);o.coc=5;o.sh=55;o.id=3}
 else if(t<9.0){const z=camT4(t);o.pos=new V3(z.x-4.2,8.5,48.5);o.tg=z;o.fov=lerp(9.2,12.5,sstep(7.2,8.4,t));o.coc=7;o.sh=16;o.id=4}
 else{const u=sstep(9.0,10,t);o.pos=new V3(lerp(31.8,30.6,u),lerp(9.6,8.9,u),lerp(12.2,11.0,u));o.tg=new V3(23.1,.45,1.45);o.fov=25;o.coc=5;o.sh=16;o.id=5}
 return o}

/* ================= UI ================= */
const $=id=>document.getElementById(id);
function ui(t){const trk=$('trk'),ti=sstep(1.9,2.25,t);trk.style.opacity=ti;trk.style.transform=`translateX(${(1-ti)*30}px)`;
 const set=(id,txt,on,cls)=>{const e=$(id);e.textContent=on?txt:'—';e.className=on?(cls||''):'dim'};
 set('t1','52 MPH',t>=T_REL+.05);const fu=clamp((t-T_REL)/(T_CATCH-T_REL),0,1);set('t2',Math.round(35*fu)+' YDS',t>=T_REL+.05);set('t3',(2.1*fu).toFixed(1)+' SEC',t>=T_REL+.05);
 set('t4','32 YDS',t>=9.15,'g');set('t5','1ST DOWN',t>=9.3,'g');
 const run=clamp(t-T_SNAP,0,7.6);const s=372-Math.floor(run);$('clk').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 const up=t>=9.42;$('dd').textContent=up?'1ST & 10':'2ND & 8';$('spot').textContent=up?'BALL ON MICH 26':'BALL ON ND 42';
 const fl=bump(9.42,9.46,9.75,t);$('dd').style.background=fl>0?`rgb(${244-30*fl},${244-40*fl},${240-190*fl})`:'';
 const c=$('comp'),cw=sstep(9.25,9.5,t);c.style.opacity=cw;c.style.clipPath=`inset(0 ${(1-cw)*100}% 0 0)`}

/* ================= RENDER ================= */
function render(t){frame(t);ballG.position.copy(BALL.p);ballG.quaternion.copy(BALL.q);
 const fu=clamp((t-T_REL)/(T_CATCH-T_REL),0,1);tracerMat.uniforms.uHead.value=t<T_REL?-1:t<9.0?fu:1.0;tracerMat.uniforms.uA.value=t<9.0?.9*(1-sstep(T_CATCH+.25,T_CATCH+1.0,t)):.55*sstep(9.05,9.35,t);
 routeArt.forEach(m=>{m.material.uniforms.uHead.value=sstep(.15,.85,t)+.001;m.material.uniforms.uA.value=.85*(1-sstep(1.6,2.25,t))});
 const la=.78*sstep(.1,.5,t)*(1-sstep(8.9,9.0,t));fdLine.material.opacity=la;losLine.material.opacity=la;
 crowdU.uTime.value=t;crowdU.uEx.value=sstep(6.5,7.2,t);
 const s=shot(t);camera.position.copy(s.pos);camera.fov=s.fov;camera.updateProjectionMatrix();
 const drift=new V3(nz(t*.35,1)*.06,nz(t*.3,2)*.04,0);camera.lookAt(s.tg.clone().add(drift));
 sun.target.position.copy(s.tg).setY(0);sun.position.copy(s.tg).setY(0).addScaledVector(SUN,160);const sc=sun.shadow.camera;sc.left=sc.bottom=-s.sh;sc.right=sc.top=s.sh;sc.near=20;sc.far=320;sc.updateProjectionMatrix();
 postMat.uniforms.focus.value=camera.position.distanceTo(s.tg);postMat.uniforms.coc.value=s.coc;postMat.uniforms.frame.value=Math.floor(t*60);postMat.uniforms.cn.value=camera.near;postMat.uniforms.cf.value=camera.far;
 renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCam);ui(t)}
// field texture after fonts
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$('stage');st.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
const Q_=new URLSearchParams(location.search);let paused=Q_.has('paused'),tcur=parseFloat(Q_.get('t')||'0'),last=performance.now();
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault()}if(e.code==='ArrowRight')tcur=Math.min(T_DUR,tcur+1/60);if(e.code==='ArrowLeft')tcur=Math.max(0,tcur-1/60);if(e.code==='KeyR')tcur=0});
document.fonts.ready.then(()=>{field.material.map=fieldTexture();field.material.needsUpdate=true;window.__ready=true;
 window.__render=t=>{render(t)};window.__info={spot:window.__spot,corr:window.__corr,speed:SPEED0,air:AIRLEN,catchP:CATCHP.toArray(),rel:FLIGHT[0].toArray()};
 if(Q_.has('capture'))return;
 const loop=now=>{const dt=Math.min(.1,(now-last)/1000);last=now;if(!paused){tcur+=dt;if(tcur>T_DUR+.6)tcur=0}render(Math.min(tcur,T_DUR));requestAnimationFrame(loop)};requestAnimationFrame(loop)});
})();
</script></body></html>
